name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The 518 MB expression matrix is gitignored, so the suite runs against a
      # synthetic matrix joined to the real tracked Model.csv / GDSC2 CSV.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest tests/ -q

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Proves the build command documented in README.md / CLAUDE.md still works
      # with the pinned requirements. Build only, never pushed.
      - name: Build drug_response_env
        run: docker build -t drug_response_env .
